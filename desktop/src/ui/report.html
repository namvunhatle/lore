<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Privacy report</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="report.css">
</head>
<body>
<main>
  <h1 data-i18n="rep.h"></h1>
  <p class="lead" id="range"></p>
  <div class="nums" id="nums"></div>
  <div class="bars" id="bars" role="img"></div>
  <h2 data-i18n="rep.top"></h2>
  <ol id="top"></ol>
  <p class="empty" id="none" hidden data-i18n="rep.none"></p>
  <p class="foot" data-i18n="rep.foot"></p>
  <button class="btn" id="copy" type="button" data-i18n="rep.copy"></button> <span id="done" role="status"></span>
</main>
<script src="i18n.js"></script>
<script src="report.js"></script>
</body>
</html>
