<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="find.css">
</head>
<body>
<form id="f" role="search" autocomplete="off">
  <input id="q" type="text" data-i18n-ph="find.ph" data-i18n-aria="find.aria" spellcheck="false">
  <span id="count" aria-live="polite"></span>
  <button type="button" class="pill" id="ask" hidden data-i18n="find.ask"></button>
  <button type="button" class="b" id="prev" data-i18n-aria="find.prev"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
  <button type="button" class="b" id="next" data-i18n-aria="find.next"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <button type="button" class="b" id="close" data-i18n-aria="find.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</form>
<script src="i18n.js"></script>
<script src="find.js"></script>
</body>
</html>
