<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passwords</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="passwords.css">
</head>
<body>
<header><h1 data-i18n="pw.h"></h1><p class="lead" data-i18n="pw.lead"></p></header>
<main>
  <form id="add" autocomplete="off">
    <input id="site" data-i18n-ph="pw.site" data-i18n-aria="pw.site" spellcheck="false" autocomplete="off">
    <input id="user" data-i18n-ph="pw.user" data-i18n-aria="pw.user" spellcheck="false" autocomplete="off">
    <input id="pass" type="text" data-i18n-ph="pw.pass" data-i18n-aria="pw.pass" spellcheck="false" autocomplete="off">
    <button class="btn" id="gen" type="button" data-i18n="pw.gen"></button>
    <button class="btn" id="all" type="button" data-i18n="pw.checkAll"></button>
    <button class="btn pri" type="submit" data-i18n="pw.save"></button>
  </form>
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden data-i18n="pw.empty"></p>
</main>
<footer><span id="status" role="status"></span></footer>
<script src="i18n.js"></script>
<script src="passwords.js"></script>
</body>
</html>
