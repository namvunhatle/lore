<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookmarks</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="list.css">
<link rel="stylesheet" href="frame.css">
</head>
<body>
<header class="top">
  <div class="titles"><h1 data-i18n="bm.title"></h1><p class="lead" data-i18n="bm.lead"></p></div>
  <form class="search" role="search" onsubmit="return false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" data-i18n-ph="bm.search" autocomplete="off" spellcheck="false" autofocus>
  </form>
  <div class="filters"><div class="chips" id="folders" role="group" data-i18n-aria="bm.folder"></div></div>
</header>
<main>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden><p id="empty-t"></p><small data-i18n="bm.emptyHint"></small></div>
</main>
<footer><button class="btn" id="openall" type="button" hidden></button><span class="grow"></span><button class="btn" id="org" type="button" data-i18n="bm.organize"></button><button class="btn" id="export" type="button" data-i18n="bm.export"></button></footer>
<script src="i18n.js"></script>
<script src="bookmarks.js"></script>
</body>
</html>
