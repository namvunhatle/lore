<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lore</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src https: http: data:">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
  <div class="tabs" id="tabs"></div>
  <nav class="side" id="side" data-i18n-aria="side.aria">
    <div class="side-top" id="side-top"></div>
    <div class="pins" id="pins" role="tablist" data-i18n-aria="side.pinned"></div>
    <div class="sscroll" id="sscroll">
      <div class="slist" id="slist" role="tablist" aria-orientation="vertical"></div>
      <button type="button" class="srow snew" id="snew"><span class="fav" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="ttl" data-i18n="side.newTab"></span></button>
    </div>
    <section class="sug" id="sug" hidden aria-labelledby="sug-h">
      <div class="sug-head"><h2 id="sug-h" data-i18n="sug.title"></h2><button type="button" class="sug-r" id="sug-r" data-i18n-aria="sug.refresh"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button></div>
      <div class="sug-list" id="sug-list"></div>
    </section>
  </nav>
  <div class="bar" id="bar">
    <div class="navs">
      <button class="ib" id="back" data-i18n-title="tip.back" data-i18n-aria="nav.back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="ib" id="fwd" data-i18n-title="tip.forward" data-i18n-aria="nav.forward"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="ib" id="reload" data-i18n-title="tip.reload" data-i18n-aria="nav.reload"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
    </div>
    <form class="omni" id="omni" autocomplete="off">
      <i class="omni-load" aria-hidden="true"></i>
      <button type="button" class="sec" id="sec" hidden data-i18n-aria="sec.aria"></button>
      <input id="intent" type="text" placeholder=" " data-i18n-aria="bar.aria" spellcheck="false">
      <span class="omni-ph" id="ph" aria-hidden="true"></span>
      <span class="ichip" id="ichip" hidden aria-live="polite"></span>
      <button type="button" class="star" id="star" hidden aria-pressed="false" data-i18n-title="tip.star" data-i18n-aria="bm.toggle"><svg width="17" height="17" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.8L12 16.8 6.7 19.6l1.1-5.8L3.5 9.7l5.9-.8z"/></svg></button>
      <kbd>⌘L</kbd>
    </form>
    <div class="tools">
      <button class="ib ctx" id="media" data-i18n-title="tip.media" data-i18n-aria="bar.media" hidden><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span class="badge">1</span></button>
      <button class="ib ctx" id="downloads" data-i18n-title="tip.downloads" data-i18n-aria="menu.downloads" hidden><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14"/></svg><span class="badge" hidden>0</span></button>
      <i class="sep" aria-hidden="true"></i>
      <button class="ib" id="shield" data-i18n-title="tip.shield" data-i18n-aria="bar.shield" aria-pressed="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path class="slash" d="M4 4l16 16"/></svg><span class="badge" id="badge">0</span></button>
      <button class="ib" id="memory" data-i18n-title="tip.memory" data-i18n-aria="bar.memory"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.4C12 4 10.9 3 9.6 3 8.2 3 7.1 4 7.1 5.3 5.4 5.6 4 7 4 8.7c0 .8.3 1.5.8 2.1-.5.6-.8 1.3-.8 2.1 0 1.3.8 2.4 2 2.8.1 1.8 1.6 3.3 3.5 3.3 1 0 1.9-.5 2.5-1.3V5.4zM12 5.4C12 4 13.1 3 14.4 3c1.4 0 2.5 1 2.5 2.3 1.7.3 3.1 1.7 3.1 3.4 0 .8-.3 1.5-.8 2.1.5.6.8 1.3.8 2.1 0 1.3-.8 2.4-2 2.8-.1 1.8-1.6 3.3-3.5 3.3-1 0-1.9-.5-2.5-1.3V5.4zM7.5 10c1.2.1 2.2.9 2.5 2M16.5 10c-1.2.1-2.2.9-2.5 2"/></svg></button>
      <button class="aibtn" id="assist" data-i18n-title="tip.assist" data-i18n-aria="more.assist" disabled><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></svg><span data-i18n="bar.ai"></span></button>
      <button class="ib" id="more" data-i18n-title="tip.more" data-i18n-aria="tip.more"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
    </div>
  </div>
  <div class="bmbar" id="bmbar" role="toolbar" hidden></div>
  <div id="toast" role="status" hidden></div>
  <div id="tip" role="tooltip" hidden></div>
  <script src="i18n.js"></script>
  <script src="tabs-common.js"></script>
  <script src="drag-math.js"></script>
  <script src="side.js"></script>
  <script src="side-drag.js"></script>
  <script src="ui.js"></script>
</body>
</html>
