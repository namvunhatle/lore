<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check a password</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="breach.css">
</head>
<body>
<main>
  <h1 data-i18n="br.h"></h1>
  <p class="lead" data-i18n="br.lead"></p>

  <p id="out" role="status"></p>
  <p class="foot" data-i18n="br.foot"></p>

<script src="i18n.js"></script>
<script src="breach.js"></script>

</html>
