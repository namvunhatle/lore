<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memory</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="dropdown.css">
<link rel="stylesheet" href="memory.css">
<link rel="stylesheet" href="frame.css">
</head>
<body>
<header class="top">
  <div class="titles"><h1 data-i18n="mem.title"></h1><p class="lead" data-i18n="mem.sub"></p></div>
  <form class="search" role="search" onsubmit="return false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" data-i18n-ph="mem.search" autocomplete="off" spellcheck="false" autofocus>
    <button class="clr" id="clr" type="button" hidden data-i18n-aria="mem.clear">×</button>
  </form>
  <div class="filters">
    <div class="chips" id="ranges" role="group" data-i18n-aria="mem.timeRange"></div>
    <select id="host" data-i18n-aria="mem.site"></select>
  </div>
  <div class="chips" id="topics" role="group" data-i18n-aria="mem.topics" hidden></div>
</header>
<main>
  <div id="digest" hidden><p class="k" id="dg-k"></p><p class="lead" id="dg-t"></p><p class="meta" id="dg-m"></p></div>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.4C12 4 10.9 3 9.6 3 8.2 3 7.1 4 7.1 5.3 5.4 5.6 4 7 4 8.7c0 .8.3 1.5.8 2.1-.5.6-.8 1.3-.8 2.1 0 1.3.8 2.4 2 2.8.1 1.8 1.6 3.3 3.5 3.3 1 0 1.9-.5 2.5-1.3V5.4zM12 5.4C12 4 13.1 3 14.4 3c1.4 0 2.5 1 2.5 2.3 1.7.3 3.1 1.7 3.1 3.4 0 .8-.3 1.5-.8 2.1.5.6.8 1.3.8 2.1 0 1.3-.8 2.4-2 2.8-.1 1.8-1.6 3.3-3.5 3.3-1 0-1.9-.5-2.5-1.3V5.4zM7.5 10c1.2.1 2.2.9 2.5 2M16.5 10c-1.2.1-2.2.9-2.5 2"/></svg>
    <p id="empty-t"></p>
    <div class="chips" id="examples"></div>
  </div>
</main>
<footer class="foot">
  <span id="count"></span>
  <span class="dot" aria-hidden="true">·</span>
  <span id="status" role="status"></span>
  <span class="spacer"></span>
  <button class="link" id="sum" type="button" data-i18n="mem.sum"></button>
  <button class="link" id="del-range" type="button" data-i18n="mem.deleteRange"></button>
  <button class="link" id="del-site" type="button" hidden></button>
  <button class="btn" id="export" type="button" data-i18n="mem.export"></button>
</footer>
<script src="i18n.js"></script>
<script src="dropdown.js"></script>
<script src="memory.js"></script>
</body>
</html>
