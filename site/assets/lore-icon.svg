<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Lore</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6544E0"/>
      <stop offset="0.55" stop-color="#4726B8"/>
      <stop offset="1" stop-color="#2F178A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- One petal: base at the origin, tip straight up. -->
    <path id="petal" d="M0 0 C-118 -120 -104 -300 0 -400 C104 -300 118 -120 0 0Z"/>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <!-- A lotus: five petals, the outer pair softer, drawn back to front. Stroke in the background tone separates them. -->
  <g transform="translate(512 745) scale(1.2)" stroke="#3A1FA3" stroke-width="10" stroke-linejoin="round">
    <use href="#petal" transform="rotate(-66) scale(.76)" fill="#A996F2"/>
    <use href="#petal" transform="rotate(66) scale(.76)" fill="#A996F2"/>
    <use href="#petal" transform="rotate(-33) scale(.9)" fill="#CBBEFF"/>
    <use href="#petal" transform="rotate(33) scale(.9)" fill="#CBBEFF"/>
    <use href="#petal" fill="#FFFFFF"/>
  </g>
</svg>
