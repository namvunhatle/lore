version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Electron is upgraded on purpose, following the rule in docs/release.md.
      - dependency-name: electron
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
