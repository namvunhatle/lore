name: release

# Push a tag such as v0.2.0 to build the installers and attach them to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: |
              desktop/dist/Lore-mac-*.dmg
          - os: windows-latest
            script: dist:win
            files: |
              desktop/dist/Lore-win-*-setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      # Compiles the bundled ad-block lists first (predist:*), then packages. Builds are not code-signed yet.
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Checksums
        run: cd installers && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          # Only tags like v1.0.0-beta.1 are pre-releases: GitHub's "latest release" link ignores pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Installers are **not code-signed** yet. Windows SmartScreen and macOS Gatekeeper will warn you: on macOS right-click the app and choose Open the first time. You can also build from source: see the README.

            `SHA256SUMS.txt` lists a checksum for each installer: compare it with what you downloaded before you run it.
