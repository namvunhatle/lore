name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # every Monday: catches a new Electron major even when nobody is pushing
  workflow_dispatch:

jobs:
  # The Rust core job comes back when core/Cargo.toml exists. (A job-level `if: hashFiles(...)` is not allowed by
  # GitHub Actions: it makes the whole workflow invalid, so no job runs at all.)

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test

  electron-freshness:
    # Fails when the pinned Electron is two or more majors behind (see docs/release.md).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node desktop/scripts/check-electron.js --strict
